{% extends "base.html" %}
{% block title %}设置{% endblock %}
{% block content %}
<h1>设置</h1>
<p>本地保存状态：<span id="storage-status">检查中…</span></p>
<fieldset class="font-size">
  <legend>正文字号</legend>
  <label><input type="radio" name="fs" value="22"> 22</label>
  <label><input type="radio" name="fs" value="26" checked> 26</label>
  <label><input type="radio" name="fs" value="30"> 30</label>
</fieldset>
<section>
  <h2>导出备份</h2>
  <p><button type="button" id="export-btn">导出备份文本</button></p>
  <textarea id="export-text" readonly rows="8" placeholder="点击导出后此处显示备份文本"></textarea>
</section>
<section>
  <h2>导入备份</h2>
  <textarea id="import-text" rows="8" placeholder="粘贴备份 JSON 文本"></textarea>
  <p><button type="button" id="import-btn">校验并预览</button></p>
  <div id="import-preview" hidden></div>
  <p><button type="button" id="import-confirm" hidden>确认导入</button></p>
</section>
<section>
  <h2>清除记录</h2>
  <p><button type="button" id="clear-btn">清除本课程学习记录</button></p>
  <p class="note">仅清除本项目的保存数据，保留字号设置。</p>
</section>
<noscript><p>备份的导出、导入与清除需要脚本支持；无脚本时设置不可用。</p></noscript>
<ol id="catalog-lessons" hidden>
{% for l in lessons %}  <li data-lesson-id="{{ l.id }}"></li>
{% endfor %}</ol>
<ol id="catalog-questions" hidden>
{% for q in questions %}  <li data-question-id="{{ q.question_id }}"></li>
{% endfor %}</ol>
{% endblock %}
