schemaVersion: 1
id: m0-reading-code
title: 看懂 Python 代码的基本样子
goal: 第一次看到 Python 代码时，能认出"一行一件事、从上到下执行"的样子，能指出引号里的文字、括号、逗号、等号、注释各长什么样，并知道中文标点会导致报错。
revision: 1
status: published
prerequisites: []
steps:
  - id: s-goal
    type: read
    title: 本课目标：先学会"看"
    bodyMd: |
      这一课不写程序，只学"看"。学完之后，你再看到一段 Python 代码，不会再觉得"这些符号都是什么"。
      你要能做到：看到 `print("你好")` 这样的行，能说出"这行在屏幕上显示'你好'两个字"；看到 `#` 开头的行，知道它是写给人看的说明；看到中文括号、缺引号这种写法，能感觉到"这行不对劲，会报错"。
  - id: s-lines
    type: read
    title: 一行代码做一件事，从上到下执行
    bodyMd: |
      Python 代码是一行一行读的：**一行做一件事，从上到下依次执行**。下面这个例子里，第一行显示"你好"，第二行显示"世界"，屏幕上最后出现两行：

      ```python
      print("你好")
      print("世界")
      ```

      输出：

      ```
      你好
      世界
      ```

      `print` 是"显示在屏幕上"的意思。把 `print` 和它后面的括号连起来看，就是一个完整动作：把括号里的东西显示出来。
  - id: s-quotes
    type: reveal
    title: 为什么文字要用引号包起来
    bodyMd: |
      引号里的东西是"**文字本身**"：`print("你好")` 的意思是显示"你好"这两个字，引号告诉 Python——里面就是字面上的文字，不要做别的理解。
      如果漏掉引号会发生什么？先预测：`print(你好)` 还能显示出"你好"吗？
    revealLabel: 先预测，再点开展开
    revealMd: |
      去掉引号会报错停住。没有引号，Python 不认识这两个字，整行直接失败、不会再继续执行。
      这种报错长什么样、怎么读懂它，下一课 M0-3 会专门教你看懂，这一课只要记住结论：**文字本身必须用引号包起来**。
  - id: s-symbols
    type: read
    title: 先认识三个符号：() , =
    bodyMd: |
      看到代码先认三个符号，用一句话记住它们各自长什么样：
      - `()`：小括号。**跟在 print 后面，表示"执行这个显示操作"**。括号里放的是要显示的东西。
      - `,`：逗号。**分隔多个要显示的东西**，比如下面这行会同时显示"你好"和"世界"，中间用一个空格隔开：

      ```python
      print("你好", "世界")
      ```

      - `=`：等号。**先只要求你认出这个符号**，看到它心里记一下"这行里有个等号"就行。它的真正含义第 01 课会系统讲，这一课不讲。
  - id: s-comment
    type: read
    title: '"#" 开头的是注释，写给人看的'
    bodyMd: |
      以 `#` 开头的一行叫**注释**（解释说明的文字）。Python 读到 `#` 会跳过这一整行，完全不执行。注释是写给人看的：提醒自己或别人这段代码在干什么。

      ```python
      # 下面这行会显示"你好"
      print("你好")
      ```

      运行只输出 `你好`，第一行注释没有任何动静——它本来就不是用来执行的。以后你看别人代码时，先认出注释，就能更快抓住代码想说什么。
  - id: s-punct
    type: reveal
    title: 中文标点 vs 英文标点：真实报错长什么样
    bodyMd: |
      写代码必须用**英文标点**：小括号是 `()`，引号是 `""`。中文输入法打出来的 `（）` 和 `""` 长得像，但 Python 不认。
      先预测：运行 `print（"hi"）`（用的是中文括号）会发生什么？会输出 hi 吗？
    revealLabel: 先预测，再点开展开真实报错
    revealMd: |
      真实运行一次，报错原样如下（文件名换成了 `hello.py`，行内容和箭头位置都是真实的）：

      ```text
        File "hello.py", line 1
          print（"hi"）
               ^
      SyntaxError: invalid character '（' (U+FF08)
      ```

      三个要点：第一行告诉你出错在第 1 行；`^` 小箭头指向了中文括号 `（`；最后一行说 `invalid character '（'`，意思是"非法字符"。结论很简单：**括号、引号、逗号都必须用英文的**，写代码时先把输入法切到英文。
  - id: s-space
    type: read
    title: 引号里的空格会原样输出
    bodyMd: |
      引号里的东西是"文字本身"，所以里面的空格也会一个不少地显示出来：

      ```python
      print("你好   世界")
      ```

      运行后屏幕上是 `你好   世界`，中间三个空格原样保留。想让输出里有空格，就在引号里打空格；引号外面的空格（比如 `print` 和 `(` 之间）基本不影响执行，不用纠结。
  - id: s-newline-indent
    type: read
    title: 换行分隔不同的行；缩进不能随意改
    bodyMd: |
      **换行用来分隔不同的行**：回车换一行，就是新的一件事。删掉换行把两行挤成一行，Python 会把它当一件事，意思就乱了。
      关于行开头的空格（**缩进**，就是"一行开头空了几个格"）：这一课只记住一句话——**缩进不能随意改动**，该对齐的要对齐。后面用到缩进的课程会一步步讲清规则，现在先养成"不要手欠去动行首空格"的习惯。
  - id: s-quiz-1
    type: quiz
    title: 小测一：预测输出
    questionId: m0-reading-code-q1
    revision: 1
    promptMd: |
      运行 `print("你好", "世界")` 这一行，屏幕上会显示什么？
    options:
      - id: a
        textMd: "`你好世界`"
        explanationMd: 对应"逗号只是分隔、显示时原样拼接"的错误理解。逗号分隔的多个东西显示时，中间会自动加一个空格，所以不是紧贴在一起的"你好世界"。
      - id: b
        textMd: "`你好 世界`"
        explanationMd: 正确。括号里是两个要用引号包起来的"文字本身"；逗号分隔多个要显示的东西，显示时中间用一个空格隔开。
      - id: c
        textMd: "报错"
        explanationMd: 对应"两个引号串在一起会出错"的错误理解。这行用的全是英文标点、引号也都配对，是合法写法，会正常执行而不是报错。
      - id: d
        textMd: "`你好`"
        explanationMd: 对应"逗号后面的东西被忽略"的错误理解。print 会把括号里逗号分隔的每一项都显示出来，不会只显示第一项就停下。
    correctOptionId: b
    explanationMd: |
      `print("你好", "世界")` 里，引号把两段"文字本身"包好，逗号分隔它们，显示时中间用一个空格隔开，所以输出是 `你好 世界`。本课只要求看出"两个文字都被显示了、中间有个空格"。
  - id: s-quiz-2
    type: quiz
    title: 小测二：找出注释行
    questionId: m0-reading-code-q2
    revision: 1
    promptMd: |
      下面哪一行是注释（Python 会跳过不执行的那行）？
    options:
      - id: a
        textMd: "`print(\"你好\")`"
        explanationMd: 这行会被执行：print 是显示操作，括号里引号包着"文字本身"，运行后屏幕上会出现"你好"。注释不会产生任何输出。
      - id: b
        textMd: "`# 显示问候语`"
        explanationMd: 正确。以 `#` 开头就是注释，Python 读到 `#` 会跳过整行。它只是写给人看的说明，不会显示、不会执行。
      - id: c
        textMd: "`print(\"早安\") # 显示早安`"
        explanationMd: 这行里只有 `#` 后面的"显示早安"是注释，前面的 `print("早安")` 仍然会被正常执行，屏幕上会出现"早安"。一整行都是注释，必须整行以 `#` 开头。
      - id: d
        textMd: "`\"这是一个注释\"`"
        explanationMd: 对应"引号里的字都是注释"的错误理解。引号里的只是"文字本身"，注释的唯一标志是行首（或代码后的）`#`。
    correctOptionId: b
    explanationMd: |
      认注释只看一个标志：`#`。以 `#` 开头的整行是注释，Python 会跳过不执行；`#` 写在一行代码后面时，后半段是注释、前半段照常执行。引号里的文字只是"文字本身"，和注释没有关系。
  - id: s-recap
    type: read
    title: 回顾与检验方法
    bodyMd: |
      本课要点：
      1. 一行代码做一件事，Python 从上到下依次执行。
      2. 引号里的是"文字本身"；漏掉引号会报错，下一课 M0-3 会教你看懂这种报错。
      3. 认出 `()`（跟在 print 后面表示执行显示操作）、`,`（分隔多个要显示的东西）、`=`（先只认符号，含义第 01 课系统讲）。
      4. `#` 开头的是注释，写给人看，Python 跳过不执行。
      5. 括号、引号、逗号必须用英文标点；中文标点会报 `SyntaxError: invalid character`。
      6. 引号里的空格原样输出；换行分隔不同的行；行开头的缩进不能随意改动。
      检验一下：随便找一段本节出现过的代码遮住答案，一行一行说出"这一行在干什么"，全说对就过关。
