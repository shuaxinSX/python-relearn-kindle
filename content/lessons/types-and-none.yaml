schemaVersion: 1
id: types-and-none
title: 基本类型、转换与 None
goal: 在运算前判断拿到的是数字、文本、真假还是缺失值，并选择明确的转换或缺失表达。
revision: 2
status: published
prerequisites:
  - run-and-bindings
steps:
  - id: s-goal
    type: read
    title: 本课目标与需要唤回的能力
    bodyMd: |
      上一课学会了用"绑定"逐行追踪每个名字的当前值。本课唤回这项能力，并加一个新要求：动手运算之前，先判断值的类型。
      学完这一课，你要能做到三件事：看到一个值，先说出它是整数、浮点数、文本、真假值还是缺失值；明白 `"3"` 和 `3` 不能混在一起运算；需要把文本里的数字当数量用时，先明确转换并另存，原始文本保持原样。
  - id: s-mechanism
    type: read
    title: 核心机制：类型属于值，转换产生新值
    bodyMd: |
      类型属于值所对应的对象，不是名字永久自带的属性。名字 raw 这一刻绑定字符串 `"3"`，下一刻也可以重新绑定整数 `3`；变化的是绑定的值，不是名字本身的"户口"。
      `int("3")` 的含义是"按整数规则解读这段文本，交出一个新值"。它不会就地改掉 raw：转换只产生结果，结果交给谁由等号左边的名字决定。
      `None` 是约定的缺失标记，表示"没有值"。它不是字符串 `"None"`，也不是 0。"没填"和"填了 0"是两回事，缺失和零必须分开表达。

      ```python
      raw = "3"  # raw 绑定字符串
      count = int(raw)  # 产生整数 3，raw 不动
      print(raw, count)
      print(type(raw), type(count))
      ```
  - id: s-type-check
    type: read
    title: 类型与转换的最小对照
    bodyMd: |
      `type(value)` 查看值的类型；`int` 表示整数，`str` 表示文本，`float` 表示浮点数，`bool` 表示真假（True/False）。`str(3)` 得到文本 `"3"`，方便拼接说明；`float("3.5")` 得到浮点值。浮点数不等于精确十进制，本轮不展开误差。
      `/` 是除法，`//` 在正整数例子里给出整除后的整数部分：`7 / 2` 为 3.5，`7 // 2` 为 3。`int(3.9)` 去掉小数部分得 3，不是四舍五入。`int("bad")` 会因文本不符合整数规则而报 ValueError；这里只识别，处理留到 13 课。
  - id: s-predict
    type: reveal
    title: 主例：先预测，再展开
    bodyMd: |
      下面代码用两种方式处理文本 `"3"`。先别往下翻：在纸上写下你预测的输出，再点击展开核对。
      预测时逐行问自己：这一行操作的是什么类型的值？`+` 遇到文本和遇到整数，做的是同一件事吗？转换发生在哪一行？

      ```python
      raw = "3"
      print(raw + "2")
      count = int(raw)
      print(count + 2)
      ```
    revealLabel: 先预测，再点开展开实际输出
    revealMd: |
      实际输出：

      ```
      32
      5
      ```

      逐行追踪：第 1 行 raw 绑定字符串 `"3"`；第 2 行 `raw + "2"` 是两个文本相加，含义是拼接，得到新文本 `"32"`，raw 本身不变；第 3 行 `int(raw)` 按整数解读文本，产生新值 3 绑定给 count；第 4 行 `count + 2` 是两个整数相加，得到 5。
      为什么不是其他结果？`+` 的含义由值的类型决定：文本相加是拼接，整数相加才是算术。`int(raw)` 只交出一个新值，不会把 raw 就地变成整数；第 2 行发生在转换之前，只能做拼接，不可能得到 5。
  - id: s-misconception
    type: reveal
    title: 误区对照：int(raw) 会改掉 raw 吗
    bodyMd: |
      有人认为"调用 `int(raw)` 就把 raw 本人变成了整数"。下面这段代码检验这个想法，顺带看清两个 `3` 的区别。
      先在纸上写下你的预测：三个 print 各输出什么？再点击展开核对实际输出和解释。

      ```python
      raw = "3"
      count = int(raw)
      print(raw)
      print(count)
      print(type(raw))
      ```
    revealLabel: 先预测，再点开展开实际输出
    revealMd: |
      实际输出：

      ```
      3
      3
      <class 'str'>
      ```

      逐行追踪：`count = int(raw)` 只产生新值交给 count，raw 仍绑定原来的字符串 `"3"`。前两个输出看起来都是字符 3，但第三行证明 raw 的类型还是 str。
      两个结论：第一，转换不会改掉原名字，想用转换结果就必须用新名字接住；第二，能不能参与数值运算只看类型，不看长相——看起来像数字的文本，仍是文本。
  - id: s-quiz-1
    type: quiz
    title: 小测一：判断类型与运算结果
    questionId: types-and-none-q1
    revision: 1
    promptMd: |
      ```python
      raw = "3"
      count = int(raw)
      ```
      判断三件事：raw 的类型、count 的类型、`count + 2` 的值。选出全对的一组。
    options:
      - id: a
        textMd: raw 是 str；count 是 str；`count + 2` 是 `"32"`
        explanationMd: 对应"文本和数字可以混着运算"的错误理解：认为 `int(raw)` 只是"看起来像数字的文本"，加法仍按文本拼接处理。实际 count 是整数 3，`count + 2` 是整数加法，结果是 5。
      - id: b
        textMd: raw 是 int；count 是 int；`count + 2` 是 `5`
        explanationMd: 对应"转换会就地修改原值"的错误理解：认为调用 `int(raw)` 会把 raw 本人变成整数。转换只产生新值交给 count，raw 仍绑定原来的字符串 `"3"`，类型还是 str。
      - id: c
        textMd: raw 是 str；count 是 int；`count + 2` 是 `5`
        explanationMd: 正确。转换产生的新值 3 交给了 count，raw 不变仍是 str；整数 3 加 2 得 5。
      - id: d
        textMd: raw 是 str；count 是 str；`count + 2` 是 `5`
        explanationMd: 对应"运算时会自动转换"的错误理解：认为 count 还是文本 `"3"`，但 Python 会在加法时自动把它转成数字。Python 不会这样猜：文本 `"3"` 加整数 2 会直接报错，而不是自动得到 5。
    correctOptionId: c
    explanationMd: |
      类型决定运算的含义：`int(raw)` 把文本解读成整数 3 交给 count，raw 本人不被修改，仍是 str；整数 3 加 2 是算术，结果为 5。既不能把原值当成已被转换，也不能指望文本在运算中自动变成数字。
  - id: s-quiz-2
    type: quiz
    title: 小测二：缺失与零的数据设计
    questionId: types-and-none-q2
    revision: 1
    promptMd: |
      一份资料登记表有"份数"一栏：有人明确填写了 0，有人根本没填。现在要用一个名字 count 保存"份数"，选出能区分这两种情况的数据设计。（本题只做数据设计，不写分支判断。）
    options:
      - id: a
        textMd: 没填也记成 0，和"填写了 0"用同一个值
        explanationMd: 对应"缺失可以归零"的错误理解：没填表示"不知道"，填了 0 表示"明确是零份"。两者都记成 0 之后，事后无法区分"确实没有"和"还没登记"，数据已经丢失了信息。
      - id: b
        textMd: 没填用 `None`，填写了 0 就用整数 `0`
        explanationMd: 正确。None 是约定的缺失标记，表示"没有值"；0 是明确的数值，表示"零份"。两者类型和含义都不同，之后才能分别处理。
      - id: c
        textMd: 没填用空文本 `""`
        explanationMd: 对应"空文本等于缺失"的错误理解：空文本仍是一个字符串值，表示"一段长度为零的文本"，不是"没有值"。用它表示缺失，会和真正的文本数据混在一起，也掩盖了"没填"这个事实。
      - id: d
        textMd: 没填用字符串 `"None"`
        explanationMd: 对应"把缺失写成文本"的错误理解：`"None"` 是四个字符组成的普通字符串，和缺失标记 None 是两回事。用字符串表示缺失，后续无法用统一的缺失判断区分它，它只是一个长得像"无"的文本。
    correctOptionId: b
    explanationMd: |
      缺失和零是两种事实："没填"用 None 表示约定好的缺失，"填了 0"用整数 0 表示明确的零份。空文本和字符串 `"None"` 都是有具体内容的值，不能代替"没有值"。
  - id: s-recap
    type: read
    title: 回忆总结与独立任务
    bodyMd: |
      本课要点：
      1. 类型属于值，不是名字的属性；名字重新绑定后，类型跟着新值走。
      2. `"3"` 是文本，`3` 是整数；文本的 `+` 是拼接，整数的 `+` 才是算术。
      3. 转换产生新值，不就地修改原名字；想用结果就要用名字接住。
      4. `None` 表示约定的缺失，不是 0、不是空文本、不是字符串 `"None"`。
      口头检查：变量显示为空，能否直接判断它就是 None？（不能：空文本和 None 看起来都"空"，但类型和含义不同。）
      独立任务（在 PyCharm 完成）：给定 `raw = "12"`，写出把它转成整数数量并保留 raw 原值的三行脚本，运行后用 type 核对两个名字的类型；再写一句注释说明为什么"没填"不能直接记成 0。这里不提供答案代码。
